# Spotflow SDK
CONFIG_SPOTFLOW=y
CONFIG_SPOTFLOW_MODULE_DEFAULT_LOG_LEVEL=4

# Logging
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_REQUIRES_FLOAT_PRINTF=y
CONFIG_LOG_FUNC_NAME_PREFIX_INF=y
CONFIG_LOG_FUNC_NAME_PREFIX_WRN=y
CONFIG_LOG_FUNC_NAME_PREFIX_ERR=y
CONFIG_SPOTFLOW_LOG_BACKEND_QUEUE_SIZE=16
CONFIG_SPOTFLOW_LOG_BUFFER_SIZE=256
CONFIG_SPOTFLOW_CBOR_LOG_MAX_LEN=512
CONFIG_HEAP_MEM_POOL_ADD_SIZE_SPOTFLOW_LOGGING=3072

# Metrics
CONFIG_SPOTFLOW_METRICS=y
CONFIG_SPOTFLOW_METRICS_SYSTEM=y
CONFIG_SPOTFLOW_METRICS_SYSTEM_RESET_CAUSE=y
CONFIG_SPOTFLOW_METRICS_HEARTBEAT=y
CONFIG_SPOTFLOW_METRICS_HEARTBEAT_INTERVAL=60
CONFIG_HEAP_MEM_POOL_ADD_SIZE_SPOTFLOW_METRICS=6144

# Networking (Ethernet + DHCP; TLS/MQTT are pulled in by the Spotflow module)
CONFIG_NETWORKING=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y

# Flash: enabled for the coredump partition backend (see boards/*.overlay).
#
# Spotflow config persistence (NVS/settings) is intentionally disabled on this
# board. The Spotflow config store initializes from the log backend before the
# kernel scheduler is running, and the STM32 QSPI flash that would hold the
# storage partition cannot service a blocking read that early (it returns
# -EDEADLK). Logs, metrics, and coredumps do not depend on persistence.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SPOTFLOW_SAMPLE_CONFIG_PERSISTENCE_FLASH=n

# Coredumps: captured to the internal-flash coredump partition on a fatal
# fault, then uploaded to Spotflow on the next boot over MQTT/TLS.
# CONFIG_SPOTFLOW_COREDUMPS selects DEBUG_COREDUMP, FLASH and REBOOT and
# defaults the backend to DEBUG_COREDUMP_BACKEND_FLASH_PARTITION. THREADS mode
# dumps thread stacks and metadata instead of the whole linker-defined RAM
# image, which keeps the dump well inside the 256 KiB partition.
CONFIG_SPOTFLOW_COREDUMPS=y
CONFIG_DEBUG_COREDUMP_THREADS_METADATA=y
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_THREADS=y
CONFIG_GPIO=y

# Constrain the application image to the code partition (first 768 KiB), leaving
# the last flash sector for coredumps (see boards/stm32f746g_disco.overlay).
CONFIG_USE_DT_CODE_PARTITION=y

# Local display: 4.3" LTDC LCD via LVGL v9 with FT5336 capacitive touch.
# The framebuffer lives in the external SDRAM (see the board devicetree).
CONFIG_DISPLAY=y
CONFIG_INPUT=y
CONFIG_LVGL=y
CONFIG_LV_Z_POINTER_INPUT=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_USE_IMAGE=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_Z_MEM_POOL_SIZE=32768

# Keep LVGL's working buffers out of the scarce 256 KiB internal SRAM by placing
# both the object memory pool and the render buffers in the 8 MiB external SDRAM
# (the "SDRAM1" memory-region from the board devicetree).
CONFIG_LV_Z_MEMORY_POOL_ZEPHYR_REGION=y
CONFIG_LV_Z_MEMORY_POOL_ZEPHYR_REGION_NAME="SDRAM1"
CONFIG_LV_Z_BUFFER_ALLOC_STATIC=y
CONFIG_LV_Z_VDB_ZEPHYR_REGION=y
CONFIG_LV_Z_VDB_ZEPHYR_REGION_NAME="SDRAM1"

# Stack
CONFIG_MAIN_STACK_SIZE=4096
