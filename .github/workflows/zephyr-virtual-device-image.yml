name: Zephyr virtual device image

# Builds, tests and publishes ghcr.io/spotflow-io/zephyr-virtual-device through
# build-virtual-device-image.yml. Pull requests build and test the image
# without publishing it. A push to main publishes the tags "latest" and
# "sha-<commit>".
#
# Run the workflow manually on main to rebuild the image when the Spotflow
# Device SDK changes: the image always contains the SDK revision pinned in
# zephyr-virtual-device/west.yml at build time.

on:
  push:
    branches:
      - main
    paths:
      - zephyr-virtual-device/**
      - "!zephyr-virtual-device/**.md"
      - .github/workflows/zephyr-virtual-device-image.yml
      - .github/workflows/build-virtual-device-image.yml
  pull_request:
    paths:
      - zephyr-virtual-device/**
      - "!zephyr-virtual-device/**.md"
      - .github/workflows/zephyr-virtual-device-image.yml
      - .github/workflows/build-virtual-device-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  image:
    uses: ./.github/workflows/build-virtual-device-image.yml
    with:
      example: zephyr-virtual-device
      title: Spotflow virtual device (Zephyr)
      description: Zephyr RTOS firmware with the Spotflow device SDK, running on an emulated Arm Cortex-M3 board in QEMU. No hardware needed.
