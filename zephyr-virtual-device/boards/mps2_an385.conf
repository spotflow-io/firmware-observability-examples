# The emulated clock must follow wall-clock time, because the device talks to
# a real server. With icount enabled, QEMU fast-forwards idle time and network
# timeouts fire early.
CONFIG_QEMU_ICOUNT=n

# QEMU user-mode networking (SLIRP): outbound TCP through the host, no root
# and no TAP interface needed. The emulated NIC is the board's LAN9118.
CONFIG_NET_QEMU_USER=y

# The MPS2 AN385 model has no entropy source. This generator is NOT
# cryptographically secure. It is acceptable for a demo device that holds no
# secrets other than a free-tier ingest key. Never use it in a product.
CONFIG_TEST_RANDOM_GENERATOR=y

# The Ethernet driver RX thread and TLS need more room than the defaults
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
