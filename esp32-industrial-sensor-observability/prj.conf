# ============================================
# Spotflow SDK
# ============================================
CONFIG_SPOTFLOW=y
CONFIG_SPOTFLOW_MODULE_DEFAULT_LOG_LEVEL=4

# ============================================
# Logging
# ============================================
CONFIG_LOG=y

# Zephyr log ring buffer (stage 1). Default 1024 B overflows during the early
# boot burst before the log thread gets a timeslice, causing dropped messages.
CONFIG_LOG_BUFFER_SIZE=2048

CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_REQUIRES_FLOAT_PRINTF=y

# Show function names in log output, helps trace crashes to the exact call site.
CONFIG_LOG_FUNC_NAME_PREFIX_INF=y
CONFIG_LOG_FUNC_NAME_PREFIX_WRN=y
CONFIG_LOG_FUNC_NAME_PREFIX_ERR=y

# Spotflow backend queue (stage 2), independent of CONFIG_LOG_BUFFER_SIZE.
# QUEUE_SIZE: messages buffered during offline periods.
# LOG_BUFFER_SIZE: per-message staging buffer; size to your longest log line.
CONFIG_SPOTFLOW_LOG_BACKEND_QUEUE_SIZE=16
CONFIG_SPOTFLOW_LOG_BUFFER_SIZE=256
CONFIG_SPOTFLOW_CBOR_LOG_MAX_LEN=512
CONFIG_HEAP_MEM_POOL_ADD_SIZE_SPOTFLOW_LOGGING=3072

# ============================================
# Metrics
# ============================================
CONFIG_SPOTFLOW_METRICS=y
CONFIG_SPOTFLOW_METRICS_SYSTEM=y
CONFIG_SPOTFLOW_METRICS_SYSTEM_RESET_CAUSE=y
CONFIG_SPOTFLOW_METRICS_HEARTBEAT=y
CONFIG_SPOTFLOW_METRICS_HEARTBEAT_INTERVAL=60

# ============================================
# Coredumps
# ============================================
CONFIG_SPOTFLOW_COREDUMPS=y
CONFIG_GPIO=y
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_LINKER_RAM=y
CONFIG_DEBUG_COREDUMP_THREADS_METADATA=y

# ============================================
# Networking
# ============================================
CONFIG_NETWORKING=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y

# ============================================
# Flash / Settings (required by Spotflow for state persistence)
# ============================================
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# ============================================
# Stack / Heap
# ============================================
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_ADD_SIZE_SPOTFLOW_METRICS=6144

# Ensures connection works on boards without hardware RNG.
# Remove this option for production use.
CONFIG_MBEDTLS_PSA_CRYPTO_LEGACY_RNG=y
