# Smart Lock Fleet - Spotflow Custom Metrics Sample
#
# This sample demonstrates custom metrics reporting for a fleet of smart locks
# using the Spotflow observability platform.
#
# Reported metrics:
#   lock_operation_duration_ms  - float, 1-minute aggregation, labels: operation + method
#   door_opened                 - int,   no aggregation, no labels
#   auth_failure                - int,   no aggregation, label: method
#   battery_level_percent       - float, no aggregation, no labels

# NXP FRDM-RW612 uses Wi-Fi by default. Override to use Ethernet:
#CONFIG_SPOTFLOW_USE_ETH=y
#CONFIG_SPOTFLOW_USE_WIFI=n

# ============================================
# Spotflow SDK
# ============================================
CONFIG_SPOTFLOW=y
CONFIG_SPOTFLOW_MODULE_DEFAULT_LOG_LEVEL=3

# ============================================
# Metrics Configuration
# ============================================
CONFIG_SPOTFLOW_METRICS=y
CONFIG_SPOTFLOW_METRICS_SYSTEM=y

# ============================================
# Logging
# ============================================
CONFIG_LOG=y
CONFIG_REQUIRES_FLOAT_PRINTF=y

# ============================================
# Networking
# ============================================
CONFIG_NETWORKING=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y

# Increase main stack size
CONFIG_MAIN_STACK_SIZE=4096
